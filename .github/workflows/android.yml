name: Android quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK tools on the Ubuntu runner
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          "$SDK_MANAGER" --version
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
      - name: Install SDK packages used by current AGP configuration
        run: |
          sdkmanager --install 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Install Gradle without relying on missing wrapper files
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle --no-daemon lintDebug --stacktrace
      - name: Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/

# Release-gating follow-ups:
# - Commit a genuine Gradle wrapper with a verified official wrapper JAR.
# - Supply an authorized Firebase test configuration.
# - Add Firestore emulator rules tests and Android instrumentation matrix.
