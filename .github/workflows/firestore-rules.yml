name: Firestore security rule tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase test tools
        run: npm install --no-audit --no-fund
      - name: Execute rules with isolated local emulator
        run: npx firebase emulators:exec --project demo-no-project --only firestore "npm run test:firestore"
